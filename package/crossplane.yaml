---
apiVersion: meta.pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-ordering
  annotations:
    meta.crossplane.io/maintainer: Steven Borrelli <steve@borrelli.org>
    meta.crossplane.io/source: github.com/stevendborrelli/function-ordering
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      A fork of function-sequencer that declares its sequencing rules to
      Crossplane as composed resource dependencies.
    meta.crossplane.io/readme: |
      Takes function-sequencer's input unchanged. Against a Crossplane that
      advertises CAPABILITY_DEPENDENCIES - the composed resource ordering
      prototype, crossplane/crossplane#7842 - plain rules become dependencies,
      and Crossplane orders creation and deletion itself. Against any other
      Crossplane it behaves exactly as function-sequencer does.

      A work in progress, not for production use.
spec: {}
